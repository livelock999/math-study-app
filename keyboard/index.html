<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #183647; }
    .card { background: #f0f8fc; border: 2px solid #c4e1ed; border-radius: 24px;
      padding: 28px 16px; text-align: center; }
    .question { font-size: clamp(36px, 8vw, 64px); font-weight: 750; margin: 6px 0 24px; }
    .story { font-size: 24px; line-height: 1.8; text-align: left; margin: 0 0 20px; }
    .equation-editor { display: grid; grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr);
      align-items: center; gap: 6px; max-width: 330px; margin: 20px auto; }
    .equation-editor input { width: 100%; min-width: 0; font-size: 32px; }
    .equation-editor label { font-size: 16px; }
    .operator-options { display: flex; gap: 8px; justify-content: center; }
    .operator-options button { margin: 12px 0 0; padding: 12px 16px; font-size: 20px; }
    .operator-options button[aria-pressed="false"] { background: #687e8c; }
    .guidance { margin: 20px 0 0; padding: 14px; border-radius: 12px; background: #fff3c9;
      font-size: 20px; line-height: 1.7; text-align: left; }
    .navigation { display: flex; gap: 8px; justify-content: center; }
    .navigation button { font-size: 17px; padding: 12px; background: #536d7b; }
    label { display: block; font-size: 20px; margin-bottom: 8px; }
    input { width: 170px; font-size: 42px; text-align: center; padding: 8px;
      border: 2px solid #648ca0; border-radius: 12px; background: white; }
    button { display: block; margin: 20px auto 0; padding: 14px 28px; font-size: 22px;
      font-weight: 700; border: 0; border-radius: 12px; color: white; background: #126e87; cursor: pointer; }
    :focus-visible { outline: 4px solid #e7a523; outline-offset: 4px; }
    button:disabled { opacity: .55; cursor: wait; }
    .help { font-size: 15px; margin: 16px 0 0; }
    .feedback { font-size: 30px; font-weight: 700; }
    .correct { color: #146b3a; }
    .wrong { color: #8d4517; }
    .error { color: #a22b26; min-height: 24px; margin: 10px 0 0; }
    ruby rt { font-size: .48em; color: inherit; opacity: .8; font-weight: 400; }
    .reading-help { cursor: pointer; text-decoration: underline dotted; text-underline-offset: .2em; }
    .reading-help:focus-visible { outline: 3px solid #e7a523; outline-offset: 2px; }
    .reading-help-reading { font-size: .72em; font-weight: 400; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Streamlit のコンポーネント通信。入力と Enter はこの枠内で完結します。
    const root = document.getElementById('root');
    let currentToken = null;
    let shownAt = 0;
    let currentQuestionId = null;
    let pending = false;
    let eventNumber = 0;
    let defaultActionButton = null;
    let currentArgs = {};
    let draftOperation = null;
    let focusTimers = [];
    let userInteracted = false;
    let readingHelpUsed = false;
    function renderText(element, value, fieldName = null, legacyDictionary = currentArgs.furigana) {
      const text = value == null ? '' : String(value);
      const hasField = fieldName != null
        && Object.prototype.hasOwnProperty.call(currentArgs.display_fields || {}, fieldName);
      const hasDisplayWords = hasField || Object.prototype.hasOwnProperty.call(currentArgs, 'display_words');
      const dictionary = hasField ? currentArgs.display_fields[fieldName]
        : hasDisplayWords ? currentArgs.display_words : legacyDictionary;
      const entries = Object.entries(dictionary || {})
        .filter(([word, item]) => word && (hasDisplayWords
          ? item && (Array.isArray(item.parts)
            ? item.parts.every(part => part && typeof part.text === 'string')
            : typeof item.text === 'string')
          : typeof item === 'string' && item))
        .map(([word, item]) => [word, hasDisplayWords ? item : {text: word, reading: item}])
        .sort(([a], [b]) => b.length - a.length);
      element.replaceChildren();
      let accessibleText = '';
      let plainStart = 0, position = 0;
      while (position < text.length) {
        const match = entries.find(([word]) => text.startsWith(word, position));
        if (!match) { position++; continue; }
        const plain = text.slice(plainStart, position);
        if (plain) element.append(document.createTextNode(plain));
        accessibleText += plain;
        const parts = Array.isArray(match[1].parts) ? match[1].parts : [match[1]];
        for (const item of parts) {
          accessibleText += item.text;
          let content = document.createTextNode(item.text);
          if (typeof item.reading === 'string' && item.reading) {
            const ruby = document.createElement('ruby');
            const reading = document.createElement('rt'); reading.textContent = item.reading;
            reading.setAttribute('aria-hidden', 'true');
            ruby.append(content, reading); content = ruby;
          }
          if (typeof item.help_reading === 'string' && item.help_reading) {
            const helper = document.createElement('span'); helper.className = 'reading-help';
            helper.setAttribute('role', 'button'); helper.tabIndex = 0;
            helper.setAttribute('aria-label', `${item.text}の よみかたを みる`);
            helper.setAttribute('aria-expanded', 'false');
            const reading = document.createElement('span'); reading.className = 'reading-help-reading';
            reading.textContent = `（${item.help_reading}）`; reading.hidden = true;
            reading.setAttribute('aria-hidden', 'true'); helper.append(content, reading);
            const reveal = event => {
              event.preventDefault(); event.stopPropagation();
              if (pending) return;
              readingHelpUsed = true; reading.hidden = false;
              helper.setAttribute('aria-expanded', 'true');
              helper.setAttribute('aria-label', `${item.text}：${item.help_reading}`); resize();
            };
            helper.addEventListener('click', reveal);
            helper.addEventListener('keydown', event => {
              if (event.key === 'Enter' || event.key === ' ') reveal(event);
              // 数字キーも回答ショートカットへ伝播させない。
              else event.stopPropagation();
            });
            content = helper;
          }
          element.append(content);
        }
        position += match[0].length; plainStart = position;
      }
      const tail = text.slice(plainStart);
      if (tail) element.append(document.createTextNode(tail));
      accessibleText += tail;
      if (element.tagName === 'BUTTON') element.setAttribute('aria-label', accessibleText);
    }
    function send(type, extra = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, '*');
    }
    function resize() {
      send('streamlit:setFrameHeight', {height: document.body.scrollHeight + 12});
    }
    function focusInitial(element) {
      userInteracted = false;
      const token = currentToken;
      for (const delay of [0, 80, 220, 500]) {
        focusTimers.push(setTimeout(() => {
          if (token === currentToken && element.isConnected && !userInteracted) {
            // iframe自身をフォーカスしてから入力へ。親DOMにはアクセスしません。
            window.focus(); element.focus({preventScroll: true});
          }
        }, delay));
      }
    }
    function captureDraft() {
      const previous = currentArgs.draft || {};
      return {
        answer: document.getElementById('answer')?.value ?? previous.answer ?? '',
        equation_left: document.getElementById('equation_left')?.value ?? previous.equation_left ?? '',
        equation_right: document.getElementById('equation_right')?.value ?? previous.equation_right ?? '',
        selected_operation: draftOperation,
        elapsed_sec: (performance.now() - shownAt) / 1000,
        hint_used: Boolean(currentArgs.hint_used), hint_visible: Boolean(currentArgs.hint_visible),
        hint_level: Number(currentArgs.hint_level) || 0,
        explanation_visible: Boolean(currentArgs.explanation_visible), reading_help_used: readingHelpUsed
      };
    }
    function submit(action, answer = null, selectedOperation = null, extra = {}) {
      if (pending) return;
      pending = true;
      if (selectedOperation) draftOperation = selectedOperation;
      root.querySelectorAll('button').forEach(button => button.disabled = true);
      send('streamlit:setComponentValue', {value: {
        token: currentToken, event_id: `${currentToken}:${++eventNumber}`,
        action, answer, selected_operation: selectedOperation,
        response_time_sec: (performance.now() - shownAt) / 1000,
        reading_help_used: readingHelpUsed, draft: captureDraft(), ...extra
      }});
    }
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
      const args = event.data.args;
      if (args.token === currentToken) {
        pending = false;
        root.querySelectorAll('button').forEach(button => button.disabled = false);
        return;
      }
      currentToken = args.token;
      focusTimers.forEach(clearTimeout); focusTimers = [];
      currentArgs = args;
      draftOperation = args.draft?.selected_operation || args.selected_operation || null;
      const previousReadingHelp = args.draft?.reading_help_used === true || args.reading_help_used === true;
      readingHelpUsed = args.question_id !== currentQuestionId
        ? previousReadingHelp : readingHelpUsed || previousReadingHelp;
      if (args.question_id !== currentQuestionId || typeof args.elapsed_sec === 'number') {
        currentQuestionId = args.question_id;
        shownAt = performance.now() - (Number(args.elapsed_sec) || 0) * 1000;
      }
      pending = false;
      root.replaceChildren();
      const card = document.createElement('div'); card.className = 'card';
      const question = document.createElement('div'); question.className = args.word_problem ? 'story' : 'question';
      renderText(question, args.question, 'question'); card.append(question);
      if (args.word_problem && args.equation) {
        const equation = document.createElement('div'); equation.className = 'question';
        renderText(equation, args.equation); card.append(equation);
      }
      const button = document.createElement('button'); button.type = 'button';
      defaultActionButton = button;
      if (args.phase === 'choose') {
        const instruction = document.createElement('p'); renderText(instruction, 'たす？ ひく？');
        const subtract = document.createElement('button'); subtract.type = 'button';
        renderText(button, 'たす ＋'); renderText(subtract, 'ひく −');
        button.onclick = () => submit('choose_operation', null, 'addition');
        subtract.onclick = () => submit('choose_operation', null, 'subtraction');
        card.append(instruction, button, subtract);
        focusInitial(button);
      } else if (args.phase === 'equation') {
        const instruction = document.createElement('p'); renderText(instruction, 'ぶんしょうを よんで しきを つくろう');
        const options = document.createElement('div'); options.className = 'operator-options';
        const add = document.createElement('button'); add.type = 'button'; renderText(add, 'たす ＋');
        const subtract = document.createElement('button'); subtract.type = 'button'; renderText(subtract, 'ひく −');
        let operation = draftOperation || 'addition';
        const editor = document.createElement('div'); editor.className = 'equation-editor';
        const symbol = document.createElement('span'); symbol.style.fontSize = '32px';
        function chooseOperation(value) {
          operation = value;
          draftOperation = value;
          symbol.textContent = value === 'addition' ? '+' : '−';
          add.setAttribute('aria-pressed', String(value === 'addition'));
          subtract.setAttribute('aria-pressed', String(value === 'subtraction'));
        }
        add.onclick = () => chooseOperation('addition'); subtract.onclick = () => chooseOperation('subtraction');
        chooseOperation(operation); options.append(add, subtract);
        const error = document.createElement('p'); error.className = 'error'; error.setAttribute('role', 'alert');
        const fields = [];
        for (const [id, title, initial] of [['equation_left', 'ひだりの かず', args.draft?.equation_left ?? args.equation_left],
                                         ['equation_right', 'みぎの かず', args.draft?.equation_right ?? args.equation_right]]) {
          const group = document.createElement('div');
          const label = document.createElement('label'); label.htmlFor = id; renderText(label, title);
          const input = document.createElement('input'); input.id = id; input.type = 'text'; input.inputMode = 'numeric';
          input.maxLength = 2; input.autocomplete = 'off'; input.value = initial == null ? '' : String(initial);
          input.addEventListener('input', () => {
            input.value = input.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
                                     .replace(/[^0-9]/g, '').slice(0, 2);
            error.textContent = '';
          });
          group.append(label, input); fields.push(input); editor.append(group);
          if (fields.length === 1) editor.append(symbol);
        }
        renderText(button, 'この しきで こたえる ↵');
        button.onclick = () => {
          const missing = fields.find(input => !/^\d{1,2}$/.test(input.value));
          if (missing) { renderText(error, '2つの すうじを いれてね'); missing.focus(); resize(); return; }
          submit('submit_equation', null, operation,
                 {equation_left: Number(fields[0].value), equation_right: Number(fields[1].value)});
        };
        card.append(instruction, options, editor, error, button);
        focusInitial(fields[0]);
      } else if (args.phase === 'question') {
        const label = document.createElement('label'); label.htmlFor = 'answer'; renderText(label, 'こたえ');
        const input = document.createElement('input');
        input.id = 'answer'; input.type = 'text'; input.inputMode = 'numeric';
        input.autocomplete = 'off'; input.maxLength = 3;
        input.value = args.draft?.answer || '';
        input.setAttribute('aria-describedby', 'error');
        const error = document.createElement('p'); error.id = 'error'; error.className = 'error';
        error.setAttribute('role', 'alert');
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
                                   .replace(/[^0-9]/g, '').slice(0, 3);
          error.textContent = '';
        });
        renderText(button, 'こたえる ↵');
        button.onclick = () => {
          if (!/^\d{1,3}$/.test(input.value)) {
            renderText(error, 'すうじを いれてね'); input.focus(); resize(); return;
          }
          submit('answer', Number(input.value));
        };
        card.append(label, input, error, button);
        if (args.word_problem && args.equation_left != null) {
          const edit = document.createElement('button'); edit.type = 'button'; renderText(edit, 'しきを なおす');
          edit.onclick = () => submit('edit_equation'); card.append(edit);
        }
        focusInitial(input);
      } else {
        const feedback = document.createElement('p');
        feedback.className = `feedback ${args.correct ? 'correct' : 'wrong'}`;
        feedback.setAttribute('role', 'status');
        renderText(feedback, args.dont_know_used ? 'わからないを えらんだね。いっしょに たしかめよう。'
          : args.correct ? '○ せいかい！' : 'もういちど かんがえてみよう');
        const detail = document.createElement('p');
        renderText(detail, `あなたの こたえ：${args.dont_know_used ? 'わからない' : args.answer}`);
        renderText(button, args.last ? 'けっかを みる ↵' : 'つぎへ ↵');
        button.onclick = () => submit('next');
        card.append(feedback, detail, button);
        focusInitial(button);
      }
      // 新しいPython側が準備できているときだけ、途中状態を同期する補助操作を表示します。
      if (typeof args.hint_text === 'string') {
        if (args.phase !== 'feedback') {
          if (args.hint_visible) {
            const hint = document.createElement('p'); hint.className = 'guidance';
            renderText(hint, `ヒント ${Number(args.hint_level) || 1} / 3\n${args.hint_text}`, 'hint_text');
            card.append(hint);
          }
          if ((Number(args.hint_level) || 0) < 3) {
            const hintButton = document.createElement('button'); hintButton.type = 'button';
            renderText(hintButton, !args.hint_visible ? 'ヒントを みる'
              : (Number(args.hint_level) || 0) < 2 ? 'もうすこし ヒント' : 'ときかたの ヒント');
            hintButton.onclick = () => submit('show_hint'); card.append(hintButton);
          }
          const unknown = document.createElement('button'); unknown.type = 'button';
          renderText(unknown, 'わからない'); unknown.style.background = '#536d7b';
          unknown.onclick = () => submit('dont_know'); card.append(unknown);
        } else if (args.explanation_visible) {
          const explanation = document.createElement('p'); explanation.className = 'guidance';
          renderText(explanation, args.explanation_text, 'explanation_text'); card.append(explanation);
        } else {
          const explanationButton = document.createElement('button'); explanationButton.type = 'button';
          renderText(explanationButton, 'かんがえかた'); explanationButton.onclick = () => submit('show_explanation');
          card.append(explanationButton);
        }
        const navigation = document.createElement('div'); navigation.className = 'navigation';
        for (const [label, action] of [['もどる', 'pause'], ['学習履歴', 'open_history']]) {
          const link = document.createElement('button'); link.type = 'button';
          renderText(link, label, null, {...args.furigana, '学習': 'がくしゅう', '履歴': 'りれき'});
          link.onclick = () => submit(action); navigation.append(link);
        }
        card.append(navigation);
      }
      const help = document.createElement('p'); help.className = 'help';
      renderText(help, args.phase === 'choose' ? 'たす・ひくの ボタンを えらぼう ／ Tabで うつる ／ Enterで きめる'
        : args.phase === 'equation' ? 'すうじを いれる ／ Tabで うつる ／ Enterで すすむ' : args.phase === 'question'
        ? 'すうじ・テンキーで にゅうりょく ／ Enterで こたえる ／ Backspaceで けす'
        : 'Enter または ボタンで すすもう');
      card.append(help); root.append(card); resize();
    });
    document.addEventListener('keydown', event => {
      userInteracted = true;
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        if (!event.repeat) {
          const focused = document.activeElement;
          if (focused?.id === 'equation_left') {
            document.getElementById('equation_right')?.focus(); return;
          }
          const button = focused?.tagName === 'BUTTON' ? focused : defaultActionButton;
          button?.click();
        }
      }
    });
    document.addEventListener('pointerdown', () => userInteracted = true);
    window.addEventListener('blur', () => userInteracted = true);
    window.addEventListener('resize', resize);
    send('streamlit:componentReady', {apiVersion: 1});
  </script>
</body>
</html>
