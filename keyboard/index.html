<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; --ink: #24483e; --paper: #fffdf7; --sage: #d8ead2;
      --subject: #e1f0fa; --line: #d8e3dc; --muted: #64786e; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 4px 4px 12px; font-family: system-ui, "Yu Gothic", sans-serif;
      color: var(--ink); background: transparent; }
    #root { min-width: 0; }
    .card { min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 24px;
      padding: clamp(18px, 5vw, 30px); text-align: center; box-shadow: 0 5px 18px #24483e0b; }
    .question { font-size: clamp(34px, 8vw, 56px); font-weight: 750; line-height: 1.6;
      margin: 0 0 24px; padding: 18px 10px; background: var(--subject); border-radius: 20px;
      overflow-wrap: anywhere; }
    .story { font-size: clamp(22px, 5vw, 26px); line-height: 1.95; text-align: left; white-space: pre-wrap;
      margin: 0 0 24px; padding: 20px 18px; background: var(--subject); border-radius: 20px; overflow-wrap: anywhere; }
    .equation-editor { display: grid; grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr);
      align-items: center; gap: 8px; width: 100%; max-width: 360px; margin: 22px auto; }
    .equation-editor > div { min-width: 0; }
    .equation-editor.three { grid-template-columns: minmax(0, 1fr) 20px minmax(0, 1fr) 20px minmax(0, 1fr);
      max-width: 520px; gap: 6px; }
    .equation-editor.three label { font-size: 15px; }
    .equation-editor input { width: 100%; min-width: 0; font-size: clamp(28px, 7vw, 36px); }
    .equation-editor label { font-size: 16px; line-height: 1.65; overflow-wrap: anywhere; }
    .operator-options { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0 0; }
    .operator-options button { flex: 1 1 104px; margin: 0; padding: 12px; font-size: 20px; min-height: 56px; }
    .operator-options button[aria-pressed="false"] { background: var(--sage); color: var(--ink); border-color: #cadfc6;
      box-shadow: none; }
    .guidance { margin: 22px 0 0; padding: 18px; border: 1px solid #e8e0bc; border-radius: 18px;
      background: #fff6da; font-size: 20px; line-height: 1.85; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere; }
    .number-picture { padding: 16px 12px; margin: 0 0 22px; border: 1px solid var(--line);
      border-radius: 18px; text-align: left; background: #f4f8f1; }
    .picture-title { margin: 0 0 12px; font-size: 18px; font-weight: 700; }
    .picture-row + .picture-row { border-top: 1px dashed #cad7ce; padding-top: 12px; margin-top: 12px; }
    .picture-label { font-size: 15px; font-weight: 650; margin: 0 0 8px; overflow-wrap: anywhere; }
    .picture-groups { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .ten-group { display: grid; grid-template-columns: repeat(5, 16px); gap: 5px; padding: 7px;
      border: 1px solid #cad7ce; border-radius: 10px; background: white; }
    .counter { width: 16px; height: 16px; border-radius: 50%; background: #548ea0; }
    .counter.add { background: #bc784f; }
    .counter.result { background: #59825b; }
    .counter.remove { background: #fff; border: 2px solid #bc784f; position: relative; }
    .counter.remove::after { content: ''; position: absolute; left: 5px; top: -2px; width: 2px;
      height: 16px; background: #bc784f; transform: rotate(45deg); }
    .unknown-group { padding: 8px 22px; min-width: 100px; text-align: center; font-size: 26px;
      border: 2px dashed #8eaa95; border-radius: 12px; background: white; }
    .picture-note { font-size: 14px; line-height: 1.75; margin: 12px 0 0; color: var(--muted); }
    .visual-toggle { background: #edf3e8; color: var(--ink); border-color: var(--line); font-size: 19px; }
    .navigation { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 24px;
      padding-top: 20px; border-top: 1px solid var(--line); }
    .navigation button { flex: 1 1 116px; margin: 0; padding: 12px; font-size: 17px; min-height: 54px;
      background: #edf3e8; color: var(--ink); border-color: var(--line); box-shadow: none; }
    label { display: block; font-size: 20px; font-weight: 650; line-height: 1.65; margin-bottom: 12px; }
    input { width: min(180px, 100%); min-height: 70px; font: inherit; font-size: 42px; color: var(--ink);
      text-align: center; padding: 10px; border: 2px solid #aac6b5; border-radius: 18px; background: #fff;
      box-shadow: inset 0 2px 4px #24483e06; }
    button { display: block; width: 100%; max-width: 360px; min-height: 62px; margin: 18px auto 0;
      padding: 15px 18px; font: inherit; font-size: 22px; line-height: 1.55; font-weight: 700;
      border: 1px solid #24483e; border-radius: 18px; color: var(--paper); background: var(--ink);
      cursor: pointer; overflow-wrap: anywhere; box-shadow: 0 3px 8px #24483e12;
      transition: background-color .15s ease, box-shadow .15s ease; }
    button[style*="background"] { background: var(--sage) !important; color: var(--ink); border-color: #cadfc6; box-shadow: none; }
    button[aria-label*="ヒント"] { background: var(--sage); color: var(--ink); border-color: #cadfc6; box-shadow: none; }
    button:hover:not(:disabled) { box-shadow: 0 4px 12px #24483e20; }
    :focus-visible { outline: 3px solid #bb851c; outline-offset: 3px; }
    button:disabled { opacity: .5; cursor: wait; box-shadow: none; }
    .help { font-size: 15px; line-height: 1.8; color: var(--muted); margin: 22px 0 0; overflow-wrap: anywhere; }
    .feedback { font-size: clamp(24px, 6vw, 30px); font-weight: 700; line-height: 1.7; overflow-wrap: anywhere; }
    .correct { color: #24613d; }
    .wrong { color: #855123; }
    .error { color: #9b3c37; min-height: 24px; line-height: 1.7; margin: 12px 0 0; }
    ruby rt { font-size: .48em; color: inherit; opacity: .8; font-weight: 400; }
    .reading-help { cursor: pointer; text-decoration: underline dotted; text-underline-offset: .2em; }
    .reading-help:focus-visible { outline: 3px solid #bb851c; outline-offset: 2px; }
    .reading-help-reading { font-size: .72em; font-weight: 400; }
    @media (max-width: 360px) {
      .card { padding: 18px 14px; border-radius: 20px; }
      .question { padding: 16px 8px; }
      .story, .guidance { padding: 16px 14px; }
      button { padding: 14px 12px; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Streamlit のコンポーネント通信。入力と Enter はこの枠内で完結します。
    const root = document.getElementById('root');
    let currentToken = null;
    let shownAt = 0;
    let currentQuestionId = null;
    let pending = false;
    let eventNumber = 0;
    let defaultActionButton = null;
    let currentArgs = {};
    let draftOperation = null;
    let draftSecondOperation = null;
    let focusTimers = [];
    let userInteracted = false;
    let readingHelpUsed = false;
    function numberPicture(model) {
      if (!model || !Array.isArray(model.rows) || ![3, 4].includes(model.rows.length)) return null;
      if (!model.rows.every(row => row && typeof row.label === 'string'
          && (row.count === null || Number.isInteger(row.count) && row.count >= 0 && row.count <= 20))) return null;
      const figure = document.createElement('figure'); figure.className = 'number-picture';
      figure.style.marginLeft = '0'; figure.style.marginRight = '0';
      const title = document.createElement('figcaption'); title.className = 'picture-title';
      renderText(title, model.revealed ? 'ずで たしかめよう' : 'ずで かんがえよう'); figure.append(title);
      for (const row of model.rows) {
        const section = document.createElement('div'); section.className = 'picture-row';
        const label = document.createElement('p'); label.className = 'picture-label';
        renderText(label, `${row.label}：${row.count === null ? '□' : row.count + 'こ'}`);
        const groups = document.createElement('div'); groups.className = 'picture-groups';
        groups.setAttribute('aria-hidden', 'true');
        if (row.count === null) {
          const unknown = document.createElement('div'); unknown.className = 'unknown-group';
          unknown.textContent = '□'; groups.append(unknown);
        } else if (row.count === 0) {
          const empty = document.createElement('span'); empty.textContent = 'ないよ'; groups.append(empty);
        } else {
          // 10個の枠は2行、20個なら2枠。□の枠は未知数によらない同じ大きさ。
          for (let start = 0; start < row.count; start += 10) {
            const ten = document.createElement('div'); ten.className = 'ten-group';
            for (let i = start; i < Math.min(start + 10, row.count); i++) {
              const dot = document.createElement('span');
              dot.className = 'counter ' + (['add', 'remove', 'result'].includes(row.tone) ? row.tone : 'start');
              ten.append(dot);
            }
            groups.append(ten);
          }
        }
        section.append(label, groups); figure.append(section);
      }
      const note = document.createElement('p'); note.className = 'picture-note';
      renderText(note, model.caption); figure.append(note);
      return figure;
    }
    function renderText(element, value, fieldName = null, legacyDictionary = currentArgs.furigana) {
      const text = value == null ? '' : String(value);
      const hasField = fieldName != null
        && Object.prototype.hasOwnProperty.call(currentArgs.display_fields || {}, fieldName);
      const hasDisplayWords = hasField || Object.prototype.hasOwnProperty.call(currentArgs, 'display_words');
      const dictionary = hasField ? currentArgs.display_fields[fieldName]
        : hasDisplayWords ? currentArgs.display_words : legacyDictionary;
      const entries = Object.entries(dictionary || {})
        .filter(([word, item]) => word && (hasDisplayWords
          ? item && (Array.isArray(item.parts)
            ? item.parts.every(part => part && typeof part.text === 'string')
            : typeof item.text === 'string')
          : typeof item === 'string' && item))
        .map(([word, item]) => [word, hasDisplayWords ? item : {text: word, reading: item}])
        .sort(([a], [b]) => b.length - a.length);
      element.replaceChildren();
      let accessibleText = '';
      let plainStart = 0, position = 0;
      while (position < text.length) {
        const match = entries.find(([word]) => text.startsWith(word, position));
        if (!match) { position++; continue; }
        const plain = text.slice(plainStart, position);
        if (plain) element.append(document.createTextNode(plain));
        accessibleText += plain;
        const parts = Array.isArray(match[1].parts) ? match[1].parts : [match[1]];
        for (const item of parts) {
          accessibleText += item.text;
          let content = document.createTextNode(item.text);
          if (typeof item.reading === 'string' && item.reading) {
            const ruby = document.createElement('ruby');
            const reading = document.createElement('rt'); reading.textContent = item.reading;
            reading.setAttribute('aria-hidden', 'true');
            ruby.append(content, reading); content = ruby;
          }
          if (typeof item.help_reading === 'string' && item.help_reading) {
            const helper = document.createElement('span'); helper.className = 'reading-help';
            helper.setAttribute('role', 'button'); helper.tabIndex = 0;
            helper.setAttribute('aria-label', `${item.text}の よみかたを みる`);
            helper.setAttribute('aria-expanded', 'false');
            const reading = document.createElement('span'); reading.className = 'reading-help-reading';
            reading.textContent = `（${item.help_reading}）`; reading.hidden = true;
            reading.setAttribute('aria-hidden', 'true'); helper.append(content, reading);
            const reveal = event => {
              event.preventDefault(); event.stopPropagation();
              if (pending) return;
              readingHelpUsed = true; reading.hidden = false;
              helper.setAttribute('aria-expanded', 'true');
              helper.setAttribute('aria-label', `${item.text}：${item.help_reading}`); resize();
            };
            helper.addEventListener('click', reveal);
            helper.addEventListener('keydown', event => {
              if (event.key === 'Enter' || event.key === ' ') reveal(event);
              // 数字キーも回答ショートカットへ伝播させない。
              else event.stopPropagation();
            });
            content = helper;
          }
          element.append(content);
        }
        position += match[0].length; plainStart = position;
      }
      const tail = text.slice(plainStart);
      if (tail) element.append(document.createTextNode(tail));
      accessibleText += tail;
      if (element.tagName === 'BUTTON') element.setAttribute('aria-label', accessibleText);
    }
    function send(type, extra = {}) {
      window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, '*');
    }
    function resize() {
      send('streamlit:setFrameHeight', {height: document.body.scrollHeight + 12});
    }
    function focusInitial(element) {
      userInteracted = false;
      const token = currentToken;
      for (const delay of [0, 80, 220, 500]) {
        focusTimers.push(setTimeout(() => {
          if (token === currentToken && element.isConnected && !userInteracted) {
            // iframe自身をフォーカスしてから入力へ。親DOMにはアクセスしません。
            window.focus(); element.focus({preventScroll: true});
          }
        }, delay));
      }
    }
    function captureDraft() {
      const previous = currentArgs.draft || {};
      return {
        answer: document.getElementById('answer')?.value ?? previous.answer ?? '',
        equation_left: document.getElementById('equation_left')?.value ?? previous.equation_left ?? '',
        equation_right: document.getElementById('equation_right')?.value ?? previous.equation_right ?? '',
        equation_third: document.getElementById('equation_third')?.value ?? previous.equation_third ?? '',
        selected_operation: draftOperation,
        selected_second_operation: draftSecondOperation,
        elapsed_sec: (performance.now() - shownAt) / 1000,
        hint_used: Boolean(currentArgs.hint_used), hint_visible: Boolean(currentArgs.hint_visible),
        hint_level: Number(currentArgs.hint_level) || 0,
        explanation_visible: Boolean(currentArgs.explanation_visible), reading_help_used: readingHelpUsed
      };
    }
    function submit(action, answer = null, selectedOperation = null, extra = {}) {
      if (pending) return;
      pending = true;
      if (selectedOperation) {
        if (currentArgs.phase === 'choose_second') draftSecondOperation = selectedOperation;
        else draftOperation = selectedOperation;
      }
      root.querySelectorAll('button').forEach(button => button.disabled = true);
      send('streamlit:setComponentValue', {value: {
        token: currentToken, event_id: `${currentToken}:${++eventNumber}`,
        action, answer, selected_operation: selectedOperation,
        response_time_sec: (performance.now() - shownAt) / 1000,
        reading_help_used: readingHelpUsed, draft: captureDraft(), ...extra
      }});
    }
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
      const args = event.data.args;
      if (args.token === currentToken) {
        pending = false;
        root.querySelectorAll('button').forEach(button => button.disabled = false);
        return;
      }
      currentToken = args.token;
      focusTimers.forEach(clearTimeout); focusTimers = [];
      currentArgs = args;
      draftOperation = args.draft?.selected_operation || args.selected_operation || null;
      draftSecondOperation = args.draft?.selected_second_operation || args.selected_second_operation || null;
      const previousReadingHelp = args.draft?.reading_help_used === true || args.reading_help_used === true;
      readingHelpUsed = args.question_id !== currentQuestionId
        ? previousReadingHelp : readingHelpUsed || previousReadingHelp;
      if (args.question_id !== currentQuestionId || typeof args.elapsed_sec === 'number') {
        currentQuestionId = args.question_id;
        shownAt = performance.now() - (Number(args.elapsed_sec) || 0) * 1000;
      }
      pending = false;
      root.replaceChildren();
      const card = document.createElement('div'); card.className = 'card';
      const question = document.createElement('div'); question.className = args.word_problem ? 'story' : 'question';
      renderText(question, args.question, 'question'); card.append(question);
      if (args.word_problem && args.equation) {
        const equation = document.createElement('div'); equation.className = 'question';
        renderText(equation, args.equation); card.append(equation);
      }
      if (args.visual_visible) {
        const picture = numberPicture(args.visual_model);
        if (picture) card.append(picture);
      }
      const button = document.createElement('button'); button.type = 'button';
      defaultActionButton = button;
      if (args.phase === 'choose' || args.phase === 'choose_second') {
        const instruction = document.createElement('p');
        renderText(instruction, args.three_word_problem
          ? (args.phase === 'choose_second' ? '2かいめは、たす？ ひく？' : '1かいめは、たす？ ひく？')
          : 'たす？ ひく？');
        const subtract = document.createElement('button'); subtract.type = 'button';
        renderText(button, 'たす ＋'); renderText(subtract, 'ひく −');
        button.onclick = () => submit('choose_operation', null, 'addition');
        subtract.onclick = () => submit('choose_operation', null, 'subtraction');
        card.append(instruction, button, subtract);
        focusInitial(button);
      } else if (args.phase === 'equation') {
        const instruction = document.createElement('p');
        renderText(instruction, args.three_word_problem ? 'ぶんしょうの じゅんばんに、3つの かずで しきを つくろう' : 'ぶんしょうを よんで しきを つくろう');
        const options = document.createElement('div'); options.className = 'operator-options';
        const add = document.createElement('button'); add.type = 'button'; renderText(add, 'たす ＋');
        const subtract = document.createElement('button'); subtract.type = 'button'; renderText(subtract, 'ひく −');
        let operation = draftOperation || 'addition';
        let secondOperation = draftSecondOperation || 'addition';
        const editor = document.createElement('div'); editor.className = 'equation-editor';
        if (args.three_word_problem) {
          editor.classList.add('three');
          renderText(add, '1かいめ：たす ＋'); renderText(subtract, '1かいめ：ひく −');
        }
        const symbol = document.createElement('span'); symbol.style.fontSize = '32px';
        const secondSymbol = document.createElement('span'); secondSymbol.style.fontSize = '32px';
        function chooseOperation(value) {
          operation = value;
          draftOperation = value;
          symbol.textContent = value === 'addition' ? '+' : '−';
          add.setAttribute('aria-pressed', String(value === 'addition'));
          subtract.setAttribute('aria-pressed', String(value === 'subtraction'));
        }
        add.onclick = () => chooseOperation('addition'); subtract.onclick = () => chooseOperation('subtraction');
        chooseOperation(operation); options.append(add, subtract);
        const secondOptions = document.createElement('div'); secondOptions.className = 'operator-options';
        if (args.three_word_problem) {
          const addSecond = document.createElement('button'); addSecond.type = 'button'; renderText(addSecond, '2かいめ：たす ＋');
          const subtractSecond = document.createElement('button'); subtractSecond.type = 'button'; renderText(subtractSecond, '2かいめ：ひく −');
          const chooseSecond = value => {
            secondOperation = value; draftSecondOperation = value;
            secondSymbol.textContent = value === 'addition' ? '+' : '−';
            addSecond.setAttribute('aria-pressed', String(value === 'addition'));
            subtractSecond.setAttribute('aria-pressed', String(value === 'subtraction'));
          };
          addSecond.onclick = () => chooseSecond('addition'); subtractSecond.onclick = () => chooseSecond('subtraction');
          chooseSecond(secondOperation); secondOptions.append(addSecond, subtractSecond);
        }
        const error = document.createElement('p'); error.className = 'error'; error.setAttribute('role', 'alert');
        const fields = [];
        const fieldDefinitions = [['equation_left', args.three_word_problem ? '1つめの かず' : 'ひだりの かず', args.draft?.equation_left ?? args.equation_left],
                                  ['equation_right', args.three_word_problem ? '2つめの かず' : 'みぎの かず', args.draft?.equation_right ?? args.equation_right]];
        if (args.three_word_problem) fieldDefinitions.push(['equation_third', '3つめの かず', args.draft?.equation_third ?? args.equation_third]);
        for (const [id, title, initial] of fieldDefinitions) {
          const group = document.createElement('div');
          const label = document.createElement('label'); label.htmlFor = id; renderText(label, title);
          const input = document.createElement('input'); input.id = id; input.type = 'text'; input.inputMode = 'numeric';
          input.maxLength = 2; input.autocomplete = 'off'; input.value = initial == null ? '' : String(initial);
          input.addEventListener('input', () => {
            input.value = input.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
                                     .replace(/[^0-9]/g, '').slice(0, 2);
            error.textContent = '';
          });
          group.append(label, input); fields.push(input); editor.append(group);
          if (fields.length === 1) editor.append(symbol);
          if (args.three_word_problem && fields.length === 2) editor.append(secondSymbol);
        }
        renderText(button, 'この しきで こたえる ↵');
        button.onclick = () => {
          const missing = fields.find(input => !/^\d{1,2}$/.test(input.value));
          if (missing) { renderText(error, args.three_word_problem ? '3つの すうじを いれてね' : '2つの すうじを いれてね'); missing.focus(); resize(); return; }
          submit('submit_equation', null, operation,
                 {equation_left: Number(fields[0].value), equation_right: Number(fields[1].value),
                  ...(args.three_word_problem ? {equation_third: Number(fields[2].value), selected_second_operation: secondOperation} : {})});
        };
        card.append(instruction, options);
        if (args.three_word_problem) card.append(secondOptions);
        card.append(editor, error, button);
        focusInitial(fields[0]);
      } else if (args.phase === 'question') {
        const label = document.createElement('label'); label.htmlFor = 'answer'; renderText(label, args.answer_label || 'こたえ');
        const input = document.createElement('input');
        input.id = 'answer'; input.type = 'text'; input.inputMode = 'numeric';
        input.autocomplete = 'off'; input.maxLength = 3;
        input.value = args.draft?.answer || '';
        input.setAttribute('aria-describedby', 'error');
        const error = document.createElement('p'); error.id = 'error'; error.className = 'error';
        error.setAttribute('role', 'alert');
        input.addEventListener('input', () => {
          input.value = input.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0))
                                   .replace(/[^0-9]/g, '').slice(0, 3);
          error.textContent = '';
        });
        renderText(button, 'こたえる ↵');
        button.onclick = () => {
          if (!/^\d{1,3}$/.test(input.value)) {
            renderText(error, 'すうじを いれてね'); input.focus(); resize(); return;
          }
          submit('answer', Number(input.value));
        };
        card.append(label, input, error, button);
        if (args.word_problem && args.equation_left != null) {
          const edit = document.createElement('button'); edit.type = 'button'; renderText(edit, 'しきを なおす');
          edit.onclick = () => submit('edit_equation'); card.append(edit);
        }
        focusInitial(input);
      } else {
        const feedback = document.createElement('p');
        feedback.className = `feedback ${args.correct ? 'correct' : 'wrong'}`;
        feedback.setAttribute('role', 'status');
        renderText(feedback, args.dont_know_used ? 'わからないを えらんだね。いっしょに たしかめよう。'
          : args.correct ? '○ せいかい！' : 'もういちど かんがえてみよう');
        const detail = document.createElement('p');
        renderText(detail, `あなたの こたえ：${args.dont_know_used ? 'わからない' : args.answer}`);
        renderText(button, args.last ? 'けっかを みる ↵' : 'つぎへ ↵');
        button.onclick = () => submit('next');
        card.append(feedback, detail, button);
        focusInitial(button);
      }
      // 新しいPython側が準備できているときだけ、途中状態を同期する補助操作を表示します。
      if (args.visual_available && !args.visual_visible) {
        const showPicture = document.createElement('button'); showPicture.type = 'button';
        showPicture.className = 'visual-toggle';
        renderText(showPicture, args.phase === 'feedback' ? 'ずで たしかめる' : 'ずを みる');
        showPicture.onclick = () => submit('show_visual'); card.append(showPicture);
      }
      if (typeof args.hint_text === 'string') {
        if (args.phase !== 'feedback') {
          if (args.hint_visible) {
            const hint = document.createElement('p'); hint.className = 'guidance';
            renderText(hint, `ヒント ${Number(args.hint_level) || 1} / 3\n${args.hint_text}`, 'hint_text');
            card.append(hint);
          }
          if ((Number(args.hint_level) || 0) < 3) {
            const hintButton = document.createElement('button'); hintButton.type = 'button';
            renderText(hintButton, !args.hint_visible ? 'ヒントを みる'
              : (Number(args.hint_level) || 0) < 2 ? 'もうすこし ヒント' : 'ときかたの ヒント');
            hintButton.onclick = () => submit('show_hint'); card.append(hintButton);
          }
          const unknown = document.createElement('button'); unknown.type = 'button';
          renderText(unknown, 'わからない'); unknown.style.background = '#536d7b';
          unknown.onclick = () => submit('dont_know'); card.append(unknown);
        } else if (args.explanation_visible) {
          const explanation = document.createElement('p'); explanation.className = 'guidance';
          renderText(explanation, args.explanation_text, 'explanation_text'); card.append(explanation);
        } else {
          const explanationButton = document.createElement('button'); explanationButton.type = 'button';
          renderText(explanationButton, 'かんがえかた'); explanationButton.onclick = () => submit('show_explanation');
          card.append(explanationButton);
        }
        const navigation = document.createElement('div'); navigation.className = 'navigation';
        for (const [label, action] of [['もどる', 'pause'], ['学習履歴', 'open_history']]) {
          const link = document.createElement('button'); link.type = 'button';
          renderText(link, label, null, {...args.furigana, '学習': 'がくしゅう', '履歴': 'りれき'});
          link.onclick = () => submit(action); navigation.append(link);
        }
        card.append(navigation);
      }
      const help = document.createElement('p'); help.className = 'help';
      renderText(help, ['choose', 'choose_second'].includes(args.phase) ? 'たす・ひくの ボタンを えらぼう ／ Tabで うつる ／ Enterで きめる'
        : args.phase === 'equation' ? 'すうじを いれる ／ Tabで うつる ／ Enterで すすむ' : args.phase === 'question'
        ? 'すうじ・テンキーで にゅうりょく ／ Enterで こたえる ／ Backspaceで けす'
        : 'Enter または ボタンで すすもう');
      card.append(help); root.append(card); resize();
    });
    document.addEventListener('keydown', event => {
      userInteracted = true;
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault();
        if (!event.repeat) {
          const focused = document.activeElement;
          if (focused?.id === 'equation_left') {
            document.getElementById('equation_right')?.focus(); return;
          }
          if (focused?.id === 'equation_right' && document.getElementById('equation_third')) {
            document.getElementById('equation_third').focus(); return;
          }
          const button = focused?.tagName === 'BUTTON' ? focused : defaultActionButton;
          button?.click();
        }
      }
    });
    document.addEventListener('pointerdown', () => userInteracted = true);
    window.addEventListener('blur', () => userInteracted = true);
    window.addEventListener('resize', resize);
    send('streamlit:componentReady', {apiVersion: 1});
  </script>
</body>
</html>
