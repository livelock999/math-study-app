<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #253d42; font-family: system-ui, sans-serif; }
    .card { background: #f1faf5; border: 2px solid #bddbcd; border-radius: 20px; padding: 20px 16px; }
    .story { font-size: clamp(22px, 5vw, 28px); line-height: 1.9; white-space: pre-wrap; margin: 0 0 20px; }
    .question { font-size: 23px; line-height: 1.65; font-weight: 700; }
    button { display: block; width: 100%; margin: 12px 0 0; padding: 14px 12px;
      color: #fff; background: #237254; border: 0; border-radius: 12px;
      font: inherit; font-size: 22px; text-align: left; cursor: pointer; }
    button.secondary { background: #e2eee7; color: #253d42; font-size: 18px; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible { outline: 4px solid #da9212; outline-offset: 3px; }
    .feedback { font-size: 27px; font-weight: 700; }
    .correct { color: #146b3a; } .wrong { color: #8d4517; }
    .help, .explanation { font-size: 17px; line-height: 1.7; }
    .order { font-size: 21px; line-height: 1.8; min-height: 40px; }
    .hint { font-size: 20px; line-height: 1.7; background: #fff5d6; padding: 12px; }
    ruby rt { font-size: .48em; color: inherit; opacity: .8; font-weight: 400; }
    .reading-help { cursor: pointer; text-decoration: underline dotted; text-underline-offset: .2em; }
    .reading-help:focus-visible { outline: 3px solid #da9212; outline-offset: 2px; }
    .reading-help-reading { font-size: .72em; font-weight: 400; }
  </style>
</head>
<body><div id="root"></div>
<script>
const root = document.getElementById('root');
let token = null, questionId = null, shownAt = 0, phase = null;
let pending = false, hintUsed = false, order = [], choices = [], form = null;
let chooseOption = null, nextAction = null, redrawOrder = null, eventNumber = 0;
let elapsedBefore = 0, resumeToken = null;
let currentArgs = {}, readingHelpUsed = false;
function renderText(element, value, fieldName = null, legacyDictionary = currentArgs.furigana) {
  const text = value == null ? '' : String(value);
  const hasField = fieldName != null
    && Object.prototype.hasOwnProperty.call(currentArgs.display_fields || {}, fieldName);
  const hasDisplayWords = hasField || Object.prototype.hasOwnProperty.call(currentArgs, 'display_words');
  const dictionary = hasField ? currentArgs.display_fields[fieldName]
    : hasDisplayWords ? currentArgs.display_words : legacyDictionary;
  const entries = Object.entries(dictionary || {})
    .filter(([word, item]) => word && (hasDisplayWords
      ? item && (Array.isArray(item.parts)
        ? item.parts.every(part => part && typeof part.text === 'string')
        : typeof item.text === 'string')
      : typeof item === 'string' && item))
    .map(([word, item]) => [word, hasDisplayWords ? item : {text: word, reading: item}])
    .sort(([a], [b]) => b.length - a.length);
  element.replaceChildren();
  let accessibleText = '';
  let plainStart = 0, position = 0;
  while (position < text.length) {
    const match = entries.find(([word]) => text.startsWith(word, position));
    if (!match) { position++; continue; }
    const plain = text.slice(plainStart, position);
    if (plain) element.append(document.createTextNode(plain));
    accessibleText += plain;
    const parts = Array.isArray(match[1].parts) ? match[1].parts : [match[1]];
    for (const item of parts) {
      accessibleText += item.text;
      let content = document.createTextNode(item.text);
      if (typeof item.reading === 'string' && item.reading) {
        const ruby = document.createElement('ruby');
        const reading = document.createElement('rt'); reading.textContent = item.reading;
        reading.setAttribute('aria-hidden', 'true');
        ruby.append(content, reading); content = ruby;
      }
      if (typeof item.help_reading === 'string' && item.help_reading) {
        const helper = document.createElement('span'); helper.className = 'reading-help';
        helper.setAttribute('role', 'button'); helper.tabIndex = 0;
        helper.setAttribute('aria-label', `${item.text}の よみかたを みる`);
        helper.setAttribute('aria-expanded', 'false');
        const reading = document.createElement('span'); reading.className = 'reading-help-reading';
        reading.textContent = `（${item.help_reading}）`; reading.hidden = true;
        reading.setAttribute('aria-hidden', 'true'); helper.append(content, reading);
        const reveal = event => {
          event.preventDefault(); event.stopPropagation();
          if (pending) return;
          readingHelpUsed = true; reading.hidden = false;
          helper.setAttribute('aria-expanded', 'true');
          helper.setAttribute('aria-label', `${item.text}：${item.help_reading}`); resize();
        };
        helper.addEventListener('click', reveal);
        helper.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') reveal(event);
          // 数字キーも回答ショートカットへ伝播させない。
          else event.stopPropagation();
        });
        content = helper;
      }
      element.append(content);
    }
    position += match[0].length; plainStart = position;
  }
  const tail = text.slice(plainStart);
  if (tail) element.append(document.createTextNode(tail));
  accessibleText += tail;
  if (element.tagName === 'BUTTON') element.setAttribute('aria-label', accessibleText);
}
function send(type, extra = {}) { window.parent.postMessage({isStreamlitMessage: true, type, ...extra}, '*'); }
function resize() { send('streamlit:setFrameHeight', {height: document.body.scrollHeight + 12}); }
function submit(action, answer = null) {
  if (pending) return;
  pending = true;
  root.querySelectorAll('button').forEach(b => b.disabled = true);
  send('streamlit:setComponentValue', {value: {token, event_id: `${token}:${++eventNumber}`, action, answer,
    response_time_sec: elapsedBefore + (performance.now() - shownAt) / 1000,
    hint_used: hintUsed, reading_help_used: readingHelpUsed, draft_order: [...order]}});
}
function element(tag, text, className = '', fieldName = null) {
  const result = document.createElement(tag); renderText(result, text, fieldName); result.className = className; return result;
}
function button(text, handler, className = '', fieldName = null) {
  const result = element('button', text, className, fieldName); result.type = 'button'; result.onclick = handler; return result;
}
window.addEventListener('message', event => {
  if (event.source !== window.parent || event.data.type !== 'streamlit:render') return;
  const args = event.data.args;
  if (args.token === token) {
    pending = false;
    root.querySelectorAll('button').forEach(b => b.disabled = false);
    redrawOrder?.();
    return;
  }
  token = args.token; phase = args.phase; form = args.form; choices = args.choices; currentArgs = args;
  if (questionId !== args.question_id || (args.token.includes(':resume') && resumeToken !== args.token)) {
    questionId = args.question_id; resumeToken = args.token;
    hintUsed = args.draft?.hint_used === true; readingHelpUsed = args.draft?.reading_help_used === true; order = [...(args.draft?.order || [])];
    elapsedBefore = args.draft?.elapsed || 0; shownAt = performance.now();
  }
  readingHelpUsed = readingHelpUsed || args.draft?.reading_help_used === true || args.reading_help_used === true;
  pending = false; chooseOption = null; nextAction = null; redrawOrder = null; root.replaceChildren();
  const card = element('div', '', 'card');
  card.append(element('p', args.text, 'story', 'text'), element('p', args.question, 'question', 'question'));
  if (phase === 'question') {
    if (form === 'ordering') {
      const sequence = element('p', '', 'order'); sequence.setAttribute('aria-live', 'polite'); card.append(sequence);
      const optionButtons = choices.map((choice, i) => button(`${i + 1}　${choice}`, () => chooseOption(i), '', 'choices'));
      const confirm = button('この じゅんばんで こたえる ↵', () => {
        if (order.length === choices.length) submit('answer', [...order]);
      });
      const undo = button('1こ もどす', () => { order.pop(); redrawOrder(); }, 'secondary');
      const clear = button('ならべなおす', () => { order = []; redrawOrder(); }, 'secondary');
      redrawOrder = () => {
        renderText(sequence, order.length ? order.map(i => choices[i]).join(' → ') : 'えらんだ じゅんばんが ここに でるよ', order.length ? 'choices' : null);
        optionButtons.forEach((b, i) => b.disabled = pending || order.includes(i));
        confirm.disabled = pending || order.length !== choices.length;
        undo.disabled = clear.disabled = pending || order.length === 0; resize();
      };
      chooseOption = i => {
        if (pending || i < 0 || i >= choices.length || order.includes(i)) return;
        order.push(i); redrawOrder();
        if (order.length === choices.length) confirm.focus();
        else optionButtons.find(b => !b.disabled)?.focus();
      };
      card.append(...optionButtons, undo, clear, confirm);
      nextAction = () => confirm.click();
    } else {
      chooseOption = i => { if (i >= 0 && i < choices.length) submit('answer', i); };
      choices.forEach((choice, i) => card.append(button(`${i + 1}　${choice}`, () => chooseOption(i), '', 'choices')));
    }
    const hint = element('p', '', 'hint'); hint.hidden = !hintUsed;
    if (hintUsed) renderText(hint, args.hint, 'hint');
    const hintButton = button('ヒントを みる', () => {
      hintUsed = true; renderText(hint, args.hint, 'hint'); hint.hidden = false; resize();
    }, 'secondary');
    card.append(hintButton, hint);
    card.append(element('p', form === 'ordering'
      ? '1・2・3 または タッチで じゅんばんに えらぼう。Enterで こたえる。Backspaceで 1こ もどす。'
      : `${choices.map((_, i) => i + 1).join('・')} の キーや テンキー、タッチで こたえよう。Tabと Enterでも えらべるよ。`, 'help'));
  } else {
    const feedback = element('p', args.correct ? '○ せいかい！' : '× もういちど れんしゅうしよう',
                             `feedback ${args.correct ? 'correct' : 'wrong'}`);
    feedback.setAttribute('role', 'status');
    card.append(feedback, element('p', `あなたの こたえ：${args.selected}`, 'explanation', 'selected'));
    if (!args.correct) card.append(element('p', `こたえ：${args.correct_answer}`, 'explanation', 'correct_answer'));
    card.append(element('p', args.explanation, 'explanation', 'explanation'));
    const next = button(args.last ? 'けっかを みる ↵' : 'つぎへ ↵', () => submit('next'));
    card.append(next); nextAction = () => next.click();
  }
  if (args.draft != null) card.append(button('もどる', () => submit('back'), 'secondary'));
  root.append(card); redrawOrder?.(); resize();
  const initialFocus = root.querySelector('button:not(:disabled)');
  const focusToken = token;
  function focusInitial() {
    if (token !== focusToken || pending) return;
    const active = document.activeElement;
    if (active === document.body || active === document.documentElement || !document.hasFocus()) {
      window.focus(); initialFocus?.focus({preventScroll: true});
    }
  }
  requestAnimationFrame(() => { window.focus(); initialFocus?.focus({preventScroll: true}); });
  [100, 300].forEach(delay => setTimeout(focusInitial, delay));
});
document.addEventListener('keydown', event => {
  if (pending || event.isComposing || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
  if (phase === 'question' && /^[1-3]$/.test(event.key)) {
    event.preventDefault(); chooseOption?.(Number(event.key) - 1);
  } else if (event.key === 'Enter') {
    event.preventDefault();
    const focused = document.activeElement;
    if (focused?.tagName === 'BUTTON') focused.click(); else nextAction?.();
  } else if (phase === 'question' && form === 'ordering' && event.key === 'Backspace') {
    event.preventDefault(); order.pop(); redrawOrder?.();
  }
});
window.addEventListener('resize', resize);
send('streamlit:componentReady', {apiVersion: 1});
</script></body>
</html>
